name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install flet
          pip install -r requirements.txt

      - name: Build iOS IPA
        run: |
          flet build ipa --include-packages flet_audio --yes

      - name: Package into IPA
        run: |
          echo "Finding .app directory..."
          APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          echo "Found: $APP_DIR"
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -qr Antigravity.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-iOS
          path: Antigravity.ipa
